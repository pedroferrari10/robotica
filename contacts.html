<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CONTACT - Etec de Hortolândia</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background-color: #000;
			color: #fff;
			font-family: sans-serif;
		}

		.box {
			max-width: 450px;
			width: 90%;
			margin: 0 auto;
			padding: 16px;
			background-color: #121212;
			border-radius: 6px;
		}

		.titulo {
			font-size: 1.2rem;
			margin-bottom: 8px;
		}

		.linha {
			margin: 8px 0 16px 0;
			border-color: #444;
		}

		.campo {
			margin-bottom: 12px;
		}

		.campo label {
			display: block;
			margin-bottom: 4px;
			font-weight: bold;
			font-size: 0.85rem;
		}

		.campo input,
		.campo textarea {
			width: 100%;
			padding: 6px 10px;
			font-size: 0.85rem;
			background-color: #1a1a1a;
			color: #fff;
			border: 1px solid #444;
			border-radius: 4px;
		}

		.campo textarea {
			resize: none;
			height: 90px;
		}

		.botoes {
			display: flex;
			gap: 10px;
			margin-top: 16px;
		}

		.botoes button {
			padding: 6px 16px;
			font-size: 0.85rem;
		}
	</style>
</head>

<body>
	<div class="p-3 mb-2 bg-secondary text-white">
		<nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
			<div class="container-fluid">
				<a class="navbar-brand" href="index.html">
					<img src="img/etec.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
					CONTACT
				</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
					data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
					aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarNavDropdown">
					<ul class="navbar-nav">
						<li class="nav-item">
							<a class="nav-link" href="index.html">HOME</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="sobre.html">ABOUT</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="bibliografia.html">BIBLIOGRAPHY</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="creditos.html">CREDITS</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" aria-current="page" href="contacts.html">CONTACTS</a>
						</li>
						<li class="nav-item dropdown">
							<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
								aria-expanded="false">
								LANGUAGE
							</a>
							<ul class="dropdown-menu">
								<li><a class="dropdown-item" href="contatos.html">Portuguese-BR</a></li>
								<li><a class="dropdown-item active" aria-current="page" href="contacts.html">English</a></li>
							</ul>
						</li>
					</ul>
				</div>
			</div>
		</nav>
		<br>

		<div class="box">
			<h1 class="titulo">CONTACT:</h1>
			<hr class="linha">

			<form>
				<div class="campo">
					<label for="nome">Name:</label>
					<input type="text" id="nome" name="nome" pattern="[A-Za-zÀ-ÿ\s]+"
						title="Only letters are allowed" required>
				</div>

				<div class="campo">
					<label for="endereco">Address:</label>
					<input type="text" id="endereco" name="endereco" required>
				</div>

				<div class="campo">
					<label for="telefone">Phone:</label>
					<input type="tel" id="telefone" name="telefone" pattern="[\d\s()+-]+"
						title="Please enter a valid phone number" required>
				</div>

				<div class="campo">
					<label for="email">E-mail:</label>
					<input type="email" id="email" name="email" required>
				</div>

				<div class="campo">
					<label for="comentario">Comment:</label>
					<textarea id="comentario" name="comentario" rows="4"></textarea>
				</div>

				<div class="botoes">
					<button type="submit" class="btn btn-dark">Send</button>
					<button type="reset" class="btn btn-secondary">Clear</button>
				</div>
			</form>
		</div>

		<br>
		<div class="card text-bg-dark border-light mb-3">
			<div class="card-body d-flex justify-content-between align-items-center">
				<p class="card-text m-0 text-center flex-grow-1">
					Etec de Hortolândia &copy; All rights reserved<br>Non-profit academic project.
				</p>
				<a href="#" class="btn btn-primary btn-sm">Back to top</a>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
